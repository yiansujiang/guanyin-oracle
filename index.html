  <script type="text/babel">
    /* STREAMING_CHUNK:Initializing local IndexedDB storage... */
    /** @jsx React.createElement */
    /** @jsxFrag React.Fragment */
    const { useState, useRef, useEffect, useCallback } = React;

    // --- IndexedDB 地端安全圖片資料庫邏輯 ---
    const DB_NAME = 'GuanyinOracleDB';
    const STORE_NAME = 'local_images';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveImageToDB = async (filename, base64Data) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(base64Data, filename);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const loadAllImagesFromDB = async () => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.getAllKeys();
        
        request.onsuccess = () => {
          const keys = request.result;
          const images = {};
          let loaded = 0;
          if (keys.length === 0) return resolve(images);
          
          keys.forEach(key => {
            const getReq = store.get(key);
            getReq.onsuccess = () => {
              images[key] = getReq.result;
              loaded++;
              if (loaded === keys.length) resolve(images);
            };
          });
        };
        request.onerror = () => reject(request.error);
      });
    };

    const clearImagesFromDB = async () => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    /* STREAMING_CHUNK:Configuring SVG icons and card data... */
    // 高質感 SVG 圖示

    // --- Web Audio API 多維意識共振音頻合成器 ---
    // P3：改為接收外部 audioCtx（App 層單例），不在此處 new AudioContext
    // 避免每次按快門都建立新 Context，防止 Chrome 超過 6 個發出警告與 memory leak
    const playCosmicChime = (audioCtx, dynamicHz = 528) => {
      try {
        if (!audioCtx) return;
        // AudioContext 可能因瀏覽器自動暫停政策進入 suspended 狀態，需先恢復
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const oscRoot = audioCtx.createOscillator();
        const gainRoot = audioCtx.createGain();
        oscRoot.type = 'sine';
        oscRoot.frequency.setValueAtTime(136.1, audioCtx.currentTime);
        
        // 頻率受真實環境物理熵值微調
        const oscMiracle = audioCtx.createOscillator();
        const gainMiracle = audioCtx.createGain();
        oscMiracle.type = 'sine';
        oscMiracle.frequency.setValueAtTime(dynamicHz, audioCtx.currentTime);

        const oscHarmonic = audioCtx.createOscillator();
        const gainHarmonic = audioCtx.createGain();
        oscHarmonic.type = 'triangle';
        oscHarmonic.frequency.setValueAtTime(dynamicHz * 2, audioCtx.currentTime);

        const duration = 4.0;
        const now = audioCtx.currentTime;
        
        gainRoot.gain.setValueAtTime(0, now);
        gainRoot.gain.linearRampToValueAtTime(0.25, now + 0.08);
        gainRoot.gain.exponentialRampToValueAtTime(0.001, now + duration);

        gainMiracle.gain.setValueAtTime(0, now);
        gainMiracle.gain.linearRampToValueAtTime(0.35, now + 0.05);
        gainMiracle.gain.exponentialRampToValueAtTime(0.001, now + duration - 0.5);

        gainHarmonic.gain.setValueAtTime(0, now);
        gainHarmonic.gain.linearRampToValueAtTime(0.12, now + 0.02);
        gainHarmonic.gain.exponentialRampToValueAtTime(0.001, now + duration - 1.5);

        oscRoot.connect(gainRoot).connect(audioCtx.destination);
        oscMiracle.connect(gainMiracle).connect(audioCtx.destination);
        oscHarmonic.connect(gainHarmonic).connect(audioCtx.destination);

        oscRoot.start(now); oscMiracle.start(now); oscHarmonic.start(now);
        oscRoot.stop(now + duration); oscMiracle.stop(now + duration); oscHarmonic.stop(now + duration);

      } catch (err) {
        console.warn("音頻上下文受限:", err);

                          }}
                        />
                      </div>

                      {/* 下方留白區套用極致古宣紙紋理與金泥落款風格 */}
                      <div className="polaroid-text paper-texture">
                        <span className="text-xl md:text-2xl font-bold mb-1 tracking-[0.15em] text-[#1a1510]">{currentCard.name}</span>
                        <span className="text-[10px] text-stone-500 tracking-[0.25em] font-sans uppercase">· {currentCard.title} ·</span>
                        {/* v8.8 G1：手寫感日期落款（干支紀年＋西元），下載圖檔一併截入 */}
                        <span className="polaroid-datestamp">{drawDate}</span>
                      </div>
                    </div>
                    
                    {/* 背後光圈泛光陰影 (隨著滑鼠擺動形成物理投射感) */}
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[110%] h-[110%] bg-amber-500/5 blur-[50px] rounded-full z-[-1] pointer-events-none"></div>
                  </div>

                  {/* 右側：奢華金邊金箔毛玻璃經卷面板 */}
                  <div 
                    className="flex-1 w-full max-w-lg bg-[#050812]/85 backdrop-blur-2xl border border-amber-500/10 rounded-[32px] p-8 md:p-10 shadow-[0_30px_70px_rgba(0,0,0,0.9)] relative overflow-hidden flex flex-col justify-center border-l-2 border-l-amber-500/30"
                    style={{ transform: 'translateZ(20px)' }}
                  >
                    {/* 黃金電鍍流蘇邊飾 */}
                    <div className="absolute top-0 bottom-0 left-0 w-[3px] bg-gradient-to-b from-amber-300 via-amber-600 to-amber-900 opacity-80"></div>

                    <div className="mb-8 relative">
                       {/* 暗色奢華「籤」浮水印背景 */}
                       <div className="absolute -left-6 -top-12 text-9xl text-amber-500/[0.03] font-serif-tc select-none pointer-events-none font-bold">籤</div>
                       
                       <span className="text-[10px] font-cinzel text-amber-500/60 uppercase tracking-[0.3em] font-bold block mb-2">Sacred Poem</span>
                       <h3 className="text-3xl md:text-4xl font-serif-tc text-stone-100 font-bold tracking-widest mb-3 relative z-10 drop-shadow-md title-shimmer">{currentCard.title}</h3>
                       <div className="h-[2px] w-12 bg-gradient-to-r from-amber-500/60 to-transparent relative z-10"></div>
                    </div>

                    {/* 籤詩內文 (維持嚴格靠左、精確兩端對齊排版) */}
                    <p className="text-base md:text-lg font-serif-tc text-stone-200 leading-[2.4] text-justify relative z-10 mb-10 drop-shadow-sm font-medium poem-reveal">
                      「{currentCard.text}」
                    </p>

                    {/* v8.8 G3：解曰摺疊區（行動建議＋迴向語，預設收合） */}
                    <div className="relative z-10 -mt-4 mb-8">
                      <button
                        onClick={() => {
                          setShowAdvice(v => !v);
                          if (adviceTimerRef.current) { clearTimeout(adviceTimerRef.current); adviceTimerRef.current = null; }
                        }}
                        className="flex items-center gap-2 text-[11px] font-serif-tc text-amber-500/80 hover:text-amber-400 tracking-[0.3em] transition-colors"
                      >
                        <span className="inline-block w-4 h-[1px] bg-amber-500/50"></span>
                        解曰{showAdvice ? ' ▴' : ' ▾'}
                      </button>
                      {showAdvice && (
                        <div className="mt-4 pl-4 border-l border-amber-500/20 space-y-3 advice-reveal">
                          <p className="text-xs md:text-sm font-serif-tc text-stone-300 leading-[2.1] tracking-wide">
                            <span className="text-amber-500/80 font-semibold">行動建議：</span>{currentCard.advice}
                          </p>
                          <p className="text-xs md:text-sm font-serif-tc text-stone-400 leading-[2.1] tracking-wide">
                            <span className="text-amber-500/60 font-semibold">迴向語：</span>{currentCard.blessing}
                          </p>
                        </div>
                      )}
                    </div>

                    {/* v9.9：上台合影掃碼區（出示給大螢幕相機，自動帶出此尊觀音；不影響下載的拍立得影像） */}
                    <div className="relative z-10 mb-7 flex items-center gap-4 rounded-2xl border border-amber-500/15 bg-slate-950/40 p-3.5 md:p-4">
                      <div
                        ref={qrRef}
                        className="shrink-0 bg-white rounded-lg flex items-center justify-center"
                        style={{ width: '104px', height: '104px', padding: '4px' }}
                      ></div>
                      <div className="font-serif-tc leading-[1.9]">
                        <p className="text-[11px] font-cinzel tracking-[0.25em] text-amber-500/60 uppercase mb-1">On-Stage Photo</p>
                        <p className="text-sm md:text-base text-stone-200 font-medium">上台合影．出示此碼</p>
                        <p className="text-xs md:text-sm text-stone-400 mt-1">走到台前相機前掃描，<br/>大螢幕將自動為您請出{currentCard.title}，與您同框合影。</p>
                      </div>
                    </div>

                    {/* 底部高奢感操作按鈕 */}
                    <div className="flex flex-wrap gap-4 relative z-10 mt-auto">
                      <button
                        onClick={handleResetRequest}
                        disabled={isDownloading}
                        className="px-6 py-2.5 rounded-full border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-900 transition-all flex items-center gap-2 disabled:opacity-50 text-xs tracking-wider font-semibold"
                      >
                        {/* V6：換為旋轉箭頭，語意符合「再抽一次」 */}
                        <Icons.Refresh /> 重新求籤
                      </button>
                      <button 
                        onClick={handleDownload}
                        disabled={isDownloading || !canDownloadCurrentCard}
                        className={`px-6 py-2.5 rounded-full ${
                          isDownloading
                            ? 'bg-amber-950 cursor-wait'
                            : !isPhotoReady
                              ? 'bg-slate-900 text-slate-500 cursor-not-allowed border border-slate-800'
                              : !canDownloadCurrentCard
                                ? 'bg-slate-900 text-slate-600 cursor-not-allowed border border-slate-800'
                                : 'bg-gradient-to-r from-amber-700 via-amber-600 to-amber-700 hover:from-amber-600 hover:to-amber-500 text-white shadow-[0_10px_20px_rgba(217,119,6,0.15)] hover:shadow-[0_15px_30px_rgba(217,119,6,0.3)]'
                        } transition-all flex items-center gap-2 font-semibold text-xs tracking-wider`}
                        title={
                          !isPhotoReady
                            ? '顯影動畫完成後即可下載（約 5 秒）'
                            : !canDownloadCurrentCard
                              ? '地端環境請先點選右上角齒輪設定匯入圖庫'
                              : ''
                        }
                      >
                        {isDownloading ? <Icons.Loading /> : <Icons.Download />}
                        {isDownloading
                          ? '轉檔中...'
                          : !isPhotoReady
                            ? '顯影中...'
                            : !canDownloadCurrentCard
                              ? '請先快取圖庫'
                              : '下載籤詩相片'}
                      </button>
                    </div>
                  </div>

                </div>
              )}
            </div>
          </div>

          {/* U3：行動端 result 底部快捷 Bar（桌機 lg: 自動隱藏，主內容已加 pb-20 避讓） */}
          {status === 'result' && currentCard && (
            <div className="mobile-action-bar">
              <button
                onClick={handleResetRequest}
                disabled={isDownloading}
                className="flex-1 py-2.5 rounded-full border border-slate-700 text-slate-300 text-xs font-serif-tc tracking-widest flex items-center justify-center gap-2 disabled:opacity-40 active:scale-95 transition-all bg-slate-900/60"
              >
                <Icons.Refresh /> 重新求籤
              </button>
              <button
                onClick={handleDownload}
                disabled={isDownloading || !canDownloadCurrentCard}
                className={`flex-1 py-2.5 rounded-full text-xs font-serif-tc tracking-widest flex items-center justify-center gap-2 active:scale-95 transition-all ${
                  isDownloading
                    ? 'bg-amber-950 cursor-wait text-amber-600'
                    : !isPhotoReady
                      ? 'bg-slate-900/60 border border-slate-700 text-slate-500 cursor-not-allowed'
                      : !canDownloadCurrentCard
                        ? 'bg-slate-900/60 border border-slate-700 text-slate-500 cursor-not-allowed'
                        : 'bg-gradient-to-r from-amber-700 to-amber-600 text-white shadow-[0_4px_16px_rgba(217,119,6,0.35)]'
                }`}
              >
                {isDownloading ? <Icons.Loading /> : <Icons.Download />}
                {isDownloading ? '轉檔中...' : !isPhotoReady ? '顯影中...' : !canDownloadCurrentCard ? '請先快取圖庫' : '下載籤詩相片'}
              </button>
              {/* v8.8 T4：Web Share 分享鈕，環境不支援時自動隱藏不佔位 */}
              {supportsWebShare && (
                <button
                  onClick={handleShare}
                  disabled={isDownloading || !canDownloadCurrentCard}
                  className={`flex-1 py-2.5 rounded-full text-xs font-serif-tc tracking-widest flex items-center justify-center gap-2 active:scale-95 transition-all ${
                    isDownloading || !canDownloadCurrentCard
                      ? 'bg-slate-900/60 border border-slate-700 text-slate-500 cursor-not-allowed'
                      : 'bg-gradient-to-r from-indigo-800 to-indigo-700 text-white shadow-[0_4px_16px_rgba(99,102,241,0.3)]'
                  }`}
                >
                  <Icons.Share /> 分享
                </button>
              )}
            </div>
          )}

          {/* Footer */}
          {/* U3：result 時行動端底部 bar 高度為 ~72px，footer 加 pb-24 lg:pb-0 避讓 */}
          <footer className={`mt-20 text-slate-600 text-[10px] text-center font-serif-tc tracking-[0.2em] relative z-10 leading-relaxed ${status === 'result' ? 'pb-24 lg:pb-0' : ''}`}>
            <p className="opacity-95">「願以此功德，普及於一切，我等與眾生，皆共成佛道」</p>
            <p className="mt-2 opacity-50 font-sans">© 2026 淨善樂人 | THE THIRTEEN GUANYINS ORACLE</p>
          </footer>

          {/* T1-3：重新求籤確認面板 */}
          {showResetConfirm && (
            <div className="fixed inset-0 z-[90] flex items-center justify-center bg-black/70 backdrop-blur-sm" onClick={handleResetCancel}>
              <div className="bg-[#0a0e1c] border border-amber-500/25 rounded-2xl p-7 max-w-[300px] mx-4 text-center shadow-[0_20px_60px_rgba(0,0,0,0.9)]" onClick={e => e.stopPropagation()}>
                <div className="text-2xl mb-3 opacity-60">🪷</div>
                <p className="text-sm font-serif-tc text-stone-200 tracking-wide leading-[2] mb-6">
                  菩薩已賜籤示，<br/>確定要重新求籤嗎？
                </p>
                <div className="flex gap-3 justify-center">
                  <button onClick={handleResetCancel} className="px-5 py-2.5 rounded-full border border-slate-700 text-slate-400 text-xs font-serif-tc tracking-widest hover:bg-slate-800 transition-all">
                    再想想
                  </button>
                  <button onClick={handleResetConfirm} className="px-5 py-2.5 rounded-full bg-gradient-to-r from-amber-700 to-amber-600 text-white text-xs font-serif-tc tracking-widest hover:from-amber-600 hover:to-amber-500 transition-all shadow-md">
                    重新求籤
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 地端圖庫快取 Modal */}
          {/* F3：外層 overlay 改用 alignItems flex-end + safe-area padding，適應 iOS 虛擬鍵盤 */}
          {showGalleryModal && (
            <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] flex items-end justify-center p-4" style={{ paddingBottom: 'max(1rem, env(safe-area-inset-bottom))' }}>
              {/* F3：Modal 本體加 max-height: 100dvh 避免超出可視區，並加 overflow-y-auto 讓內容可捲動 */}
              <div className="bg-[#0b0f1d] border border-slate-800/80 rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col" style={{ maxHeight: 'calc(100dvh - 2rem)' }}>
                <div className="p-6 border-b border-slate-800/80 flex justify-between items-center">
                  <h3 className="text-lg font-serif-tc font-bold text-amber-500 flex items-center gap-2">
                    <Icons.Image /> 地端圖庫與相干度管理
                  </h3>
                  <button onClick={() => setShowGalleryModal(false)} className="text-slate-400 hover:text-white transition-colors">
                    <Icons.Close />
                  </button>
                </div>
                
                <div className="p-6 space-y-4 overflow-y-auto">
                  <div className="bg-slate-900/60 p-4 rounded-xl text-xs text-stone-300 leading-relaxed border border-slate-800">
                    <p className="font-bold text-amber-400 mb-2">💡 本地安全政策限制提示：</p>
                    <p>當您以離線檔案模式 (file:///) 開啟此網頁時，瀏覽器出於沙盒安全機制，會限制 canvas 直接繪製地端圖檔。這將導致「下載籤詩照片」按鈕失效。</p>
                    <p className="mt-2"><strong>解決方案：</strong>點擊「選擇圖片匯入」並全選選取您的 13 張觀音像圖片。系統會自動將其保存於瀏覽器的 IndexedDB 內部數據庫，即可突破限制。</p>
                  </div>

                  <div className="flex items-center justify-between bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                    <div>
                      <p className="text-xs text-slate-400">當前快取進度</p>
                      <p className="text-2xl font-bold text-white">
                        <span className={Object.keys(dbImages).length === 13 ? 'text-emerald-400' : 'text-amber-400'}>
                          {Object.keys(dbImages).length}
                        </span> / 13
                      </p>
                    </div>
                    <div className="flex gap-2">
                      <input type="file" ref={fileInputRef} onChange={handleFileUpload} multiple accept="image/*" className="hidden" />
                      <button onClick={() => fileInputRef.current.click()} className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-semibold transition-colors shadow-md">
                        選擇圖片匯入
                      </button>
                      {Object.keys(dbImages).length > 0 && (
                        <button onClick={handleClearGallery} className="p-2 bg-rose-950/30 hover:bg-rose-900/40 text-rose-400 rounded-lg transition-colors" title="清空圖庫">
                          <Icons.Trash />
                        </button>
                      )}
                    </div>
                  </div>
                  
                  <div className="mt-4 max-h-40 overflow-y-auto pr-2">
                    <div className="grid grid-cols-2 gap-2">
                      {guanyinCards.map(card => (
                        <div key={card.id} className="flex items-center gap-2 text-xs bg-slate-900 p-2 rounded border border-slate-800">
                          {dbImages[card.image] ? <span className="text-emerald-400 text-xs">●</span> : <span className="text-slate-700 text-xs">○</span>}
                          <span className={dbImages[card.image] ? 'text-slate-200' : 'text-slate-500'}>{card.image}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
